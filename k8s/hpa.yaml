apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: health-collector
  namespace: laba14
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: health-collector
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
